<header class="site-header"><div class="site-bar">
  <a class="site-brand" href="/">sdf</a>
  <nav class="site-nav" aria-label="Catalogue navigation"><a href="/samples">Samples</a>{% if admin or admin_access %}<a href="/admin">Admin</a>{% endif %}{% if admin %}<a href="/admin/jobs">Jobs</a>{% endif %}{% if principal and principal.username %}<span class="site-identity">{{ principal.username }}</span>{% if auth_enabled %}<a href="/auth/logout">Sign out</a>{% endif %}{% elif auth_enabled %}<a href="/auth/login?next={{ request_path|default('/samples')|urlencode }}">Sign in</a>{% endif %}</nav>
  <form class="site-search" action="{{ search_action|default('/search') }}" method="get"><input name="q" value="{{ query|default('') }}" placeholder="target, component, or SDB ID" aria-label="Search SDF catalog"><button>Search</button></form>
</div></header>
