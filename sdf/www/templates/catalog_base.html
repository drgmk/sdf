<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>
  {% block head %}{% endblock %}
  <style>
    {% include "catalog_header_styles.css" %}
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202b;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.button,button{display:inline-block;padding:8px 11px;border:1px solid #9facbb;border-radius:6px;background:#fff;color:#173a60;text-decoration:none;cursor:pointer}button:disabled{cursor:wait;opacity:.65}main{max-width:1160px;margin:24px auto;padding:0 18px}.sample-page main,.sample-page .site-bar{max-width:1500px}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:26px 0 9px}.muted{color:#637183}.warning{color:#8a5200}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.card{background:#fff;border:1px solid #dce3ec;border-radius:8px;padding:12px}.card strong{display:block;font-size:22px}.cards a.card{color:inherit;text-decoration:none}.cards a.card:hover{border-color:#87a2bf}.table-wrap{overflow:auto;background:#fff;border:1px solid #dce3ec;border-radius:8px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px 11px;border-bottom:1px solid #e7ebf0;vertical-align:top}th{background:#f8fafc;font-size:13px;color:#4f6072;position:sticky;top:0}tr:last-child td{border-bottom:0}.status,.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;background:#e8edf3;color:#425366}.badge.public{background:#def3e7;color:#23613c}.badge.shared{background:#e2edff;color:#285c99}.status.current,.status.completed{background:#def3e7;color:#23613c}.status.unfit{background:#fff0c9;color:#775700}.status.stale,.status.failed{background:#fde2e4;color:#8b2e34}.status.queued,.status.running{background:#e2edff;color:#285c99}.targets{font-weight:650}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.message,.import-offer{background:#fff;border:1px solid #dce3ec;border-radius:8px;padding:18px}.import-offer{margin-top:16px}.import-offer h2{margin-top:0}.summary-line{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.summary-line span{background:#eaf0f6;border-radius:999px;padding:5px 9px}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.actions label{display:grid;gap:3px}.actions input{padding:7px 9px;border:1px solid #b8c3d1;border-radius:5px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.page-links{display:flex;gap:11px;flex-wrap:wrap;justify-content:flex-end}.page-links a{color:#285ea8;text-decoration:none}.sample-head{margin-bottom:14px}.sample-head .page-links{justify-content:flex-start;flex-wrap:nowrap;white-space:nowrap}.sample-download-links{display:flex;gap:11px;margin-left:auto}.context{color:#637083}.plot-box{background:#fff;border:1px solid #dce3ec;border-radius:8px;padding:8px;overflow:hidden}details{margin:3px 0}summary{cursor:pointer}.sample-table-tools{display:flex;align-items:center;gap:9px;margin:16px 0 8px}.sample-table-tools label{font-size:14px;color:#4f6072}.sample-table-tools input{width:min(320px,55vw);padding:7px 9px;border:1px solid #b8c3d1;border-radius:6px}.sample-table-tools .muted{font-size:13px}.sample-table-wrap{max-height:72vh}.sample-properties{font-size:14px;white-space:nowrap}.sample-properties th{top:0;padding:0;font-size:14px}.sample-properties th button{width:100%;padding:9px 10px;border:0;border-radius:0;background:transparent;color:inherit;font:inherit;text-align:left;white-space:nowrap}.sample-properties th button:hover{background:#edf3f8}.sample-properties th button span{font-size:10px}.sample-properties td{padding:8px 10px}.sample-properties td.number{text-align:right;font-variant-numeric:tabular-nums}.context-note{color:#748090;font-size:12px}.stale-note{color:#8b2e34}@media(max-width:700px){.page-head{display:block}.page-links{justify-content:flex-start;margin:12px 0}.sample-head .page-links{flex-wrap:wrap;white-space:normal}.sample-download-links{margin-left:0}.sample-table-tools{align-items:flex-start;flex-wrap:wrap}}
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
{% include "catalog_header.html" %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
