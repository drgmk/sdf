<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17202b;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dce3ec;position:sticky;top:0;z-index:2}.bar{max-width:1160px;margin:auto;min-height:58px;padding:9px 18px;display:flex;gap:18px;align-items:center}.brand{font-weight:750;font-size:20px;color:#152f4f;text-decoration:none}.nav{display:flex;gap:12px;align-items:center}.nav a{color:#385b7d;text-decoration:none}.identity{color:#637183;font-size:12px}.search{margin-left:auto;display:flex;gap:6px}.search input{width:min(330px,36vw);padding:8px 10px;border:1px solid #b8c3d1;border-radius:6px}.button,button{display:inline-block;padding:8px 11px;border:1px solid #9facbb;border-radius:6px;background:#fff;color:#173a60;text-decoration:none;cursor:pointer}main{max-width:1160px;margin:24px auto;padding:0 18px}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:26px 0 9px}.muted{color:#637183}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.card{background:#fff;border:1px solid #dce3ec;border-radius:8px;padding:12px}.card strong{display:block;font-size:22px}.cards a.card{color:inherit;text-decoration:none}.cards a.card:hover{border-color:#87a2bf}.table-wrap{overflow:auto;background:#fff;border:1px solid #dce3ec;border-radius:8px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:9px 11px;border-bottom:1px solid #e7ebf0;vertical-align:top}th{background:#f8fafc;font-size:13px;color:#4f6072;position:sticky;top:0}tr:last-child td{border-bottom:0}.status{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;background:#e8edf3;color:#425366}.status.current{background:#def3e7;color:#23613c}.status.unfit{background:#fff0c9;color:#775700}.status.stale,.status.failed{background:#fde2e4;color:#8b2e34}.status.queued,.status.running{background:#e2edff;color:#285c99}.targets{font-weight:650}.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.message{background:#fff;border:1px solid #dce3ec;border-radius:8px;padding:18px}.summary-line{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}.summary-line span{background:#eaf0f6;border-radius:999px;padding:5px 9px}.actions{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.actions label{display:grid;gap:3px}.actions input{padding:7px 9px;border:1px solid #b8c3d1;border-radius:5px}@media(max-width:700px){.bar{flex-wrap:wrap}.search{order:2;width:100%;margin:0}.search input{flex:1;width:auto}.nav{margin-left:auto}}
  </style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="/">sdf</a>
  <nav class="nav"><a href="/">Search</a><a href="/samples">Samples</a>{% if admin or admin_access %}<a href="/admin">Admin</a>{% endif %}{% if admin %}<a href="/admin/jobs">Jobs</a>{% endif %}{% if principal and principal.username %}<span class="identity">{{ principal.username }}</span>{% endif %}</nav>
  <form class="search" action="{{ search_action|default('/search') }}" method="get"><input name="q" value="{{ query|default('') }}" placeholder="target, component, or SDB ID"><button>Search</button></form>
</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
