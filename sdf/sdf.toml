# Complete defaults for sdf.
#
# These settings are used by sdf-fit, sdf-fits, and the Python package. Most
# installations only need a ~/.sdf.conf file overriding file.model_root (and
# occasionally another machine-specific path). Relative paths in this file are
# resolved from the directory containing it.

[calc]
# Number of CPUs used by older parallel utilities. The sdf-fits worker count
# is a server setting and does not come from here.
cpu = 8

[file]
# Historical rawphot files may name spectra relative to this directory.
spectra = "/path/to/spectra/"

# Model grids available to fitting. The repository includes a small set here;
# a server will normally override this in ~/.sdf.conf.
model_root = "data/models/"

# Specialist paths used when rebuilding atmosphere grids.
kurucz_models = "/path/to/kurucz/"
phoenix_models = "/path/to/phoenix/"
phoenix_cool_models = "/path/to/phoenix/cool/models/"

# Paths used by historical sample/calibration utilities.
sdb_root = "/path/to/sdb/"
www_root = "/path/to/www/"

[models]
# Wavelength grid used for models and output plots.
min_wave_micron = 0.05
max_wave_micron = 1e4
default_resolution = 200

# Model roles are inferred from these substrings.
star = ["phoenix", "kurucz", "koester", "star"]
disk = ["disk", "amsil"]
disk_r = ["_r"]

[fitting]
# Process-wide defaults. Per-system choices belong in the web UI or the
# package-local sdf-fit.yml. Each model combination, when supplied here, is an
# array of model names, for example models = [["phoenix"], ["phoenix", "disk"]].
models = []
extra_models = []

exclude_filters = []
upperlim_filters = ["GALFUV", "GALNUV"]

# Force regeneration of saved MultiNest/analysis results older than these Unix
# timestamps. Zero leaves existing results eligible for reuse.
mn_oldest = 0
an_oldest = 0

ev_threshold = 5.0
n_samples_max = 1000

# Log solid-angle range, where zero is a Solar disk at 1 pc.
model_om_lo = -10
model_om_hi = 10

# Multiplicative spectrum-normalisation range.
spectra_norm_lo = 0.3
spectra_norm_hi = 3

# MultiNest work-name construction retained for existing result directories.
model_join = "+"
pmn_dir_suffix = "-mnest"
pmn_model_suffix = "_"

n_live = 200
n_update = 50000
verb = false

# Historical result/sample database settings. Current sdf-fits catalog state
# is configured by the server and does not use these MySQL defaults.
[db]
type = "mysql"
db_sdb = "sdb"
db_samples = "sdb_samples"
db_results = "sdb_results"
phot_table = "phot"
model_table = "model"
star_table = "star"
disk_r_table = "disk_r"
sdf_fit_config = "sdf_fit_config"

[sqlite]
path = "/path/to/sqlite/db/files/"

[mysql]
host = ""
user = ""
passwd = ""

# Historical static sample/calibration website settings.
[www]
base_url = "https://sdb.drgmk.com"
sdb_path = "/"
tablemax = 5000
votmax = 10000
plotmax = 5000
cal_samples = ["bright_cal_", "landolt_1992_", "landolt_1983_", "stis_ngsl_"]
min_cal_wav = 0.017
max_cal_wav = 26.0

# Filter groups used by the filter diagnostic plot.
[filter_plot]
g1 = ["GALFUV", "GALNUV", "UJ"]
g2 = ["US", "VS", "BS", "YS", "D51"]
g3 = ["BJ", "VJ", "BL", "VL", "BT", "VT"]
